<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="heroGrad2" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow2" cx="70%" cy="40%" r="50%">
      <stop stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#heroGrad2)"/>
  <circle cx="450" cy="180" r="160" fill="url(#glow2)"/>

  <!-- Stylized medical equipment vector art -->
  <g transform="translate(320, 70)">
    <!-- Main medical console -->
    <rect x="40" y="40" width="160" height="120" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="4"/>
    <rect x="52" y="52" width="136" height="96" rx="8" fill="#1e293b"/>
    <path d="M60 100 L75 100 L85 75 L95 125 L105 90 L115 105 L125 100 L175 100" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="165" cy="65" r="5" fill="#f87171"/>
    <!-- Stand -->
    <path d="M120 160 V220 M80 220 H160" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="80" cy="226" r="6" fill="#475569"/>
    <circle cx="160" cy="226" r="6" fill="#475569"/>
    <!-- Diagnostic Probe -->
    <path d="M30 180 Q10 140 40 100" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4"/>
  </g>
</svg>

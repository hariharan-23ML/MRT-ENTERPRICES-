      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_id_001" cx="50%" cy="40%" r="55%">
      <stop stop-color="#d97706" stop-opacity="0.12"/>

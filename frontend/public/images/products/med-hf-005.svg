  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">CAT-06</text>

  <!-- Product Silhouette Vector Graphic -->

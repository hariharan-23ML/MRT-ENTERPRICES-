<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_mg_001" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_mg_001" cx="50%" cy="40%" r="55%">
      <stop stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_mg_001)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_mg_001)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">CAT-12</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- Medical Oxygen Cylinder -->
    <rect x="135" y="45" width="50" height="130" rx="20" fill="#0369a1" stroke="#0284c7" stroke-width="3"/>
    <rect x="135" y="45" width="50" height="40" rx="10" fill="#ffffff"/>
    <rect x="150" y="25" width="20" height="20" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="160" cy="115" r="14" fill="#0284c7"/>
    <text x="160" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">O2</text>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Medical Oxygen Cylinder</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-MG-001</text>
</svg>

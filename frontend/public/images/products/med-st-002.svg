<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_st_002" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_st_002" cx="50%" cy="40%" r="55%">
      <stop stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_st_002)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_st_002)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0891b2" text-anchor="middle">CAT-07</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- Vertical Steam Sterilizer -->
    <rect x="110" y="60" width="100" height="105" rx="8" fill="#f1f5f9" stroke="#0891b2" stroke-width="3.5"/>
    <ellipse cx="160" cy="60" rx="50" ry="16" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="160" cy="60" r="12" fill="#0891b2"/>
    <circle cx="160" cy="40" r="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <path d="M110 165 V180 M210 165 V180" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Vertical Steam Sterilizer</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-ST-002</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_di_003" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_di_003" cx="50%" cy="40%" r="55%">
      <stop stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_di_003)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_di_003)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#4f46e5" text-anchor="middle">CAT-02</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- Mobile C-Arm Fluoroscopy System -->
    <circle cx="160" cy="110" r="55" fill="none" stroke="#4f46e5" stroke-width="12" stroke-dasharray="210 100"/>
    <rect x="145" y="42" width="35" height="22" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="160" cy="170" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <rect x="95" y="165" width="45" height="20" rx="4" fill="#334155"/>
    <circle cx="105" cy="188" r="5" fill="#0f172a"/>
    <circle cx="130" cy="188" r="5" fill="#0f172a"/>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Mobile C-Arm System</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-DI-003</text>
</svg>

    <rect x="75" y="80" width="170" height="42" rx="12" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    <rect x="95" y="93" width="22" height="15" rx="5" fill="#ffffff"/>
    <rect x="145" y="93" width="22" height="15" rx="5" fill="#ffffff"/>

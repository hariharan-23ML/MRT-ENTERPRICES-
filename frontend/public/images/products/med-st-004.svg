<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_st_004" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_st_004" cx="50%" cy="40%" r="55%">
      <stop stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_st_004)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_st_004)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0891b2" text-anchor="middle">CAT-07</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- Washer Disinfector -->
    <rect x="95" y="45" width="130" height="125" rx="10" fill="#f8fafc" stroke="#0891b2" stroke-width="3"/>
    <rect x="110" y="60" width="100" height="90" rx="6" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="160" cy="105" r="28" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="6 3"/>
    <path d="M140 105 H180 M160 85 V125" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Washer Disinfector</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-ST-004</text>
</svg>

  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#7c3aed" text-anchor="middle">CAT-05</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">

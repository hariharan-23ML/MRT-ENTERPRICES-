    <ellipse cx="160" cy="85" rx="65" ry="32" fill="#f1f5f9" stroke="#7c3aed" stroke-width="3"/>
    <ellipse cx="160" cy="85" rx="45" ry="20" fill="#0f172a"/>
    <circle cx="160" cy="85" r="8" fill="#7c3aed"/>

      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_pm_002" cx="50%" cy="40%" r="55%">
      <stop stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.01"/>

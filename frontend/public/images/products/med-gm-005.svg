      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_gm_005" cx="50%" cy="40%" r="55%">
      <stop stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.01"/>

    <path d="M90 78 C65 78 65 133 90 133" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M230 78 C255 78 255 133 230 133" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">CAT-12</text>

  <!-- Product Silhouette Vector Graphic -->

    <rect x="105" y="45" width="110" height="120" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <rect x="115" y="58" width="90" height="18" rx="2" fill="#ffffff"/>
    <rect x="115" y="82" width="90" height="18" rx="2" fill="#ffffff"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_di_002" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_di_002" cx="50%" cy="40%" r="55%">
      <stop stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_di_002)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_di_002)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#4f46e5" text-anchor="middle">CAT-02</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- Digital X-Ray System -->
    <path d="M100 35 H220 V50 H100 Z" fill="#334155"/>
    <rect x="145" y="50" width="30" height="40" rx="4" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5"/>
    <polygon points="140,90 180,90 170,105 150,105" fill="#94a3b8"/>
    <rect x="110" y="145" width="100" height="12" rx="4" fill="#0f172a"/>
    <path d="M160 105 L120 145 M160 105 L200 145" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="80" y="157" width="160" height="14" rx="4" fill="#475569"/>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Digital X-Ray System</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-DI-002</text>
</svg>

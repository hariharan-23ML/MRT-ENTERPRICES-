<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_pm_004" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_pm_004" cx="50%" cy="40%" r="55%">
      <stop stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.01"/>

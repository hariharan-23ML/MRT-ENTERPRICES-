<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_st_005" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_st_005" cx="50%" cy="40%" r="55%">
      <stop stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_st_005)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_st_005)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0891b2" text-anchor="middle">CAT-07</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- UV-C Room Disinfection Unit -->
    <rect x="130" y="40" width="60" height="120" rx="6" fill="#0f172a" stroke="#0891b2" stroke-width="3"/>
    <rect x="142" y="48" width="10" height="100" rx="4" fill="#a5f3fc" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="168" y="48" width="10" height="100" rx="4" fill="#a5f3fc" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="160" cy="98" r="45" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="115" y="160" width="90" height="16" rx="4" fill="#334155"/>
    <circle cx="125" cy="180" r="5" fill="#0f172a"/>
    <circle cx="195" cy="180" r="5" fill="#0f172a"/>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">UV-C Room Disinfection Unit</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-ST-005</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_cr_001" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_cr_001" cx="50%" cy="40%" r="55%">
      <stop stop-color="#db2777" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_cr_001)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_cr_001)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#db2777" text-anchor="middle">CAT-03</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <rect x="100" y="60" width="120" height="80" rx="8" fill="#1e293b" stroke="#db2777" stroke-width="3"/>
        <text x="160" y="105" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">ICU Ventilator</text>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">ICU Ventilator</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-CR-001</text>
</svg>

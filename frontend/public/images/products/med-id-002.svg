<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_id_002" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_id_002" cx="50%" cy="40%" r="55%">
      <stop stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_id_002)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_id_002)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#d97706" text-anchor="middle">CAT-08</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- Syringe Infusion Pump -->
    <rect x="75" y="65" width="170" height="90" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="3"/>
    <rect x="90" y="78" width="60" height="32" rx="3" fill="#0f172a"/>
    <text x="120" y="98" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">5.0 ml/h</text>
    <rect x="160" y="85" width="70" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="210" y="80" width="8" height="28" fill="#d97706"/>
    <line x1="218" y1="94" x2="245" y2="94" stroke="#d97706" stroke-width="4"/>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Syringe Pump</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-ID-002</text>

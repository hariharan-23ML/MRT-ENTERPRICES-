<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg_med_st_003" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="glow_med_st_003" cx="50%" cy="40%" r="55%">
      <stop stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Subtle Glow -->
  <rect width="320" height="240" rx="16" fill="url(#bg_med_st_003)"/>
  <rect width="320" height="240" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="95" r="85" fill="url(#glow_med_st_003)"/>

  <!-- Category Pill Badge -->
  <rect x="14" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0891b2" text-anchor="middle">CAT-07</text>

  <!-- Product Silhouette Vector Graphic -->
  <g id="illustration">
    <!-- ETO Sterilizer -->
    <rect x="90" y="45" width="140" height="115" rx="10" fill="#1e293b" stroke="#0891b2" stroke-width="3"/>
    <rect x="105" y="60" width="75" height="85" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <rect x="190" y="65" width="28" height="40" rx="3" fill="#0891b2" opacity="0.3"/>
    <text x="204" y="88" font-family="sans-serif" font-size="9" font-weight="bold" fill="#22d3ee" text-anchor="middle">ETO</text>
    <circle cx="204" cy="125" r="6" fill="#ef4444"/>
  </g>

  <!-- Bottom SKU Bar -->
  <rect x="12" y="196" width="296" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">ETO Sterilizer</text>
  <text x="298" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end">MED-ST-003</text>
</svg>
